<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>etuKwaRuu</title>
<meta name="description" content="A dumping ground for weekend projects. Unload the truck and dig through the heap.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="scene" aria-label="A garbage truck at a dumping ground. Projects are listed in the sorted pile links."></canvas>

<div id="controls">
  <button id="unload" type="button" disabled>Loading…</button>
  <p id="hint" role="status"></p>
</div>

<div id="steer" role="group" aria-label="Drive direction">
  <div class="arrows">
    <button id="go-forward" type="button" aria-label="Drive forward" aria-keyshortcuts="ArrowLeft" aria-pressed="false"><span aria-hidden="true">◀</span></button>
    <button id="go-backward" type="button" aria-label="Drive backward" aria-keyshortcuts="ArrowRight" aria-pressed="false"><span aria-hidden="true">▶</span></button>
  </div>
</div>

<button id="gas" type="button" aria-keyshortcuts="ArrowUp" aria-pressed="false">Gas</button>

<button id="mute" type="button" aria-pressed="false">Sound on</button>

<nav id="sorted" aria-label="Sorted pile">
  <h2>Too messy? The sorted pile:</h2>
  <ul id="sorted-list"></ul>
</nav>

<dialog id="tag" aria-labelledby="tag-name">
  <div class="tag-card">
    <span class="tag-hole" aria-hidden="true"></span>
    <button id="tag-close" type="button" aria-label="Close">×</button>
    <p class="tag-kicker">Salvage tag</p>
    <h2 id="tag-name"></h2>
    <p id="tag-brief"></p>
    <dl id="tag-fields"></dl>
    <a id="tag-visit" class="tag-visit" target="_blank" rel="noopener">Visit</a>
    <span id="tag-novisit" class="tag-visit is-off">No link yet</span>
  </div>
</dialog>

<noscript><p class="noscript">The truck needs JavaScript to tip.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
